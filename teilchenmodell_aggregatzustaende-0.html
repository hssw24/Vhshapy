<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teilchenmodell – Aggregatzustände</title>

<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f6f8;
    color: #222;
    text-align: center;
  }

  h1 {
    font-size: 1.5rem;
    margin: 18px 10px 8px;
  }

  #info {
    font-size: 1rem;
    margin: 0 10px 12px;
    min-height: 24px;
  }

  canvas {
    display: block;
    width: min(94vw, 700px);
    height: min(65vh, 500px);
    margin: 0 auto;
    background: white;
    border: 2px solid #555;
    border-radius: 10px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 10px;
  }

  button {
    border: 1px solid #777;
    border-radius: 8px;
    background: white;
    padding: 10px 14px;
    font-size: 1rem;
    cursor: pointer;
  }

  button:hover, button.active {
    background: #e1e7eb;
  }
</style>
</head>

<body>

<h1>Aggregatzustände im Teilchenmodell</h1>
<div id="info">Feststoff: Die Teilchen liegen dicht beieinander und schwingen.</div>

<canvas id="canvas"></canvas>

<div class="buttons">
  <button id="solid" class="active">Feststoff</button>
  <button id="liquid">Flüssigkeit</button>
  <button id="gas">Gas</button>
</div>

<script>
/*
  Einfaches Teilchenmodell
  ------------------------
  Feststoff:
    Teilchen liegen dicht und schwingen an ihrem Platz.

  Flüssigkeit:
    Teilchen liegen dicht, können aber ihre Plätze verändern.

  Gas:
    Teilchen bewegen sich frei durch den gesamten Raum.
*/

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

let state = "solid";
let particles = [];

// Anzahl der Teilchen
const NUMBER = 45;

// Teilchen erzeugen
for (let i = 0; i < NUMBER; i++) {
  particles.push({
    x: Math.random(),
    y: Math.random(),
    vx: (Math.random() - 0.5) * 0.002,
    vy: (Math.random() - 0.5) * 0.002,
    phase: Math.random() * Math.PI * 2
  });
}

// Canvas an Bildschirmgröße anpassen
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  // Für scharfe Darstellung auf Handy und PC
  const dpr = window.devicePixelRatio || 1;

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function setState(newState) {
  state = newState;

  if (state === "solid") {
    info.textContent =
      "Feststoff: Die Teilchen liegen dicht beieinander und schwingen.";
  }

  if (state === "liquid") {
    info.textContent =
      "Flüssigkeit: Die Teilchen liegen dicht, können aber aneinander vorbeigleiten.";
  }

  if (state === "gas") {
    info.textContent =
      "Gas: Die Teilchen bewegen sich frei und verteilen sich im ganzen Raum.";
  }

  document.querySelectorAll("button").forEach(button => {
    button.classList.remove("active");
  });

  document.getElementById(state).classList.add("active");

  // Neue Ausgangspositionen für den gewählten Zustand
  if (state === "solid") {
    makeSolid();
  } else if (state === "liquid") {
    makeLiquid();
  } else {
    makeGas();
  }
}

// Feststoff: regelmäßiges Gitter
function makeSolid() {
  const columns = 9;
  const rows = 5;

  particles.forEach((p, i) => {
    const col = i % columns;
    const row = Math.floor(i / columns);

    p.x = 0.18 + col * 0.08;
    p.y = 0.25 + row * 0.11;

    p.vx = 0;
    p.vy = 0;
  });
}

// Flüssigkeit: dicht gepackter Bereich
function makeLiquid() {
  particles.forEach(p => {
    p.x = 0.15 + Math.random() * 0.70;
    p.y = 0.35 + Math.random() * 0.45;

    p.vx = (Math.random() - 0.5) * 0.0015;
    p.vy = (Math.random() - 0.5) * 0.0015;
  });
}

// Gas: im gesamten Raum verteilt
function makeGas() {
  particles.forEach(p => {
    p.x = 0.05 + Math.random() * 0.90;
    p.y = 0.05 + Math.random() * 0.90;

    p.vx = (Math.random() - 0.5) * 0.0018;
    p.vy = (Math.random() - 0.5) * 0.0018;
  });
}

function animate(time) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  ctx.clearRect(0, 0, width, height);

  particles.forEach(p => {

    if (state === "solid") {
      // Teilchen schwingen um ihren festen Platz
      const vibration = 0.006;
      const ox = Math.sin(time * 0.006 + p.phase) * vibration;
      const oy = Math.cos(time * 0.007 + p.phase) * vibration;

      drawParticle(
        (p.x + ox) * width,
        (p.y + oy) * height
      );
    }

    if (state === "liquid") {
      // Teilchen bewegen sich langsam
      p.x += p.vx;
      p.y += p.vy;

      // Bereich der Flüssigkeit
      if (p.x < 0.12 || p.x > 0.88) p.vx *= -1;
      if (p.y < 0.30 || p.y > 0.82) p.vy *= -1;

      drawParticle(p.x * width, p.y * height);
    }

    if (state === "gas") {
      // Teilchen bewegen sich frei
      p.x += p.vx;
      p.y += p.vy;

      // Abprallen an den Wänden
      if (p.x < 0.04 || p.x > 0.96) p.vx *= -1;
      if (p.y < 0.04 || p.y > 0.96) p.vy *= -1;

      drawParticle(p.x * width, p.y * height);
    }
  });

  requestAnimationFrame(animate);
}

function drawParticle(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  ctx.fillStyle = "#4b83b5";
  ctx.fill();
  ctx.strokeStyle = "#24516f";
  ctx.stroke();
}

// Start mit Feststoff
makeSolid();
requestAnimationFrame(animate);

// Buttons
document.getElementById("solid").onclick = () => setState("solid");
document.getElementById("liquid").onclick = () => setState("liquid");
document.getElementById("gas").onclick = () => setState("gas");
</script>

</body>
</html>
